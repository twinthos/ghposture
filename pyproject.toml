[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghposture"
version = "1.0.0"
description = "Deterministic GitHub estate posture scanner: secret scanning, workflow supply chain, org settings."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Twinthos"}]
dependencies = ["PyYAML>=6.0.1,<7"]

[project.scripts]
ghposture = "ghposture.cli:main"

[project.urls]
Homepage = "https://github.com/twinthos/ghposture"

[tool.setuptools.packages.find]
include = ["ghposture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
